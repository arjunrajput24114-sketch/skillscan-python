<!DOCTYPE html>
<html><body style="background:#0f172a;color:white;text-align:center;padding:60px;font-family:sans-serif">
<h1>SkillScan AI</h1>
<form action="/analyze" method="post" enctype="multipart/form-data">
<input type="file" name="resume" accept=".pdf" required><br><br>
<button style="padding:12px 24px;background:#a855f7;color:white;border:none;border-radius:8px;cursor:pointer">Analyze</button>
</form>

<style>#chat-btn{position:fixed;bottom:20px;right:20px;background:#a855f7;color:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:28px;cursor:pointer;z-index:9999}#chat-win{display:none;position:fixed;bottom:90px;right:20px;width:320px;height:380px;background:#1e293b;border:2px solid #a855f7;border-radius:15px;z-index:9999;flex-direction:column}#chat-head{background:#a855f7;padding:10px;color:#fff;font-weight:bold}#chat-msgs{flex:1;overflow-y:auto;padding:10px;text-align:left;font-size:14px}#chat-input-area{display:flex;padding:8px;border-top:1px solid #444}#chat-input-area input{flex:1;padding:8px;border-radius:6px;border:none;background:#334155;color:#fff}#chat-input-area button{margin-left:5px;background:#a855f7;color:#fff;border:none;padding:8px 12px;border-radius:6px}</style>
<button id="chat-btn" onclick="document.getElementById('chat-win').style.display='flex'">💬</button>
<div id="chat-win"><div id="chat-head">AI Chat <span onclick="document.getElementById('chat-win').style.display='none'" style="float:right;cursor:pointer">X</span></div><div id="chat-msgs"></div><div id="chat-input-area"><input id="chatInput" placeholder="Pucho..."><button onclick="sendChat()">Send</button></div></div>
<script>async function sendChat(){let i=document.getElementById('chatInput'),m=i.value;if(!m)return;let b=document.getElementById('chat-msgs');b.innerHTML+=`<div><b>You:</b> ${m}</div>`;i.value='';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let d=await r.json();b.innerHTML+=`<div><b style="color:#22c55e">AI:</b> ${d.reply}</div>`}</script>
</body></html>
